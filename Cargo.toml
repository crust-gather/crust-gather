[package]
name = "crust-gather"
version = "1.0.0"
edition = "2024"

[dependencies]
kube = { version = "5.0.0", features = ["socks5", "ws", "aws-lc-rs", "http-proxy"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"], default-features = false}
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
tar = { version = "0.4.46"}
flate2 = { version = "1.1.10"}
zip = { version = "9.3.0"}
regex = "1.13.1"
futures = "0.3.34"
duration-string = { version = "0.5.3", features = ["serde"] }
tokio-util = "0.7.20"
trait-set = "0.5.0"
actix-web = "4.18.1"
actix-ws = "0.4.0"
glob = "0.3.4"
http = "1.5.0"
serde_json_path = "0.7.2"
base64 = "0.23.1"
walkdir = "2.5.0"
logos = "0.16.1"
json-patch = "5.0.0"
jsonptr = "0.8.2"
async-stream = "0.3.6"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
chrono = { version = "0.4.45", features = ["now", "serde"] }
oci-client = "0.18.0"
hex = "0.4.3"
sha2 = "0.11.1"
cached = { version = "4.1.1", features = ["async"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = "3.27.0"
backon = "1.6.0"
indicatif = "0.18.6"
pin-project = "1.1.13"
cel = { version = "0.13", features = ["json"] }
kube-cel = { version = "0.8.0", features = ["strings", "lists", "format"] }
unselector = "0.3.0"
derive_more = { version = "2.1.1", features = ["deref", "eq", "from_str"] }
serde-saphyr = "2.1.0"
scopeguard = "1.2.0"

[dev-dependencies]
xid = "1.1.1"
serde_with = "3.24.0"
envtest = "0.4.0"

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bin]]
name = "kubectl-crust-gather"
path = "src/main.rs"
